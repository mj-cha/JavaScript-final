<!DOCTYPE html>                              <!-- HTML5 문서 선언 -->
<html lang="ko">                             <!-- 문서 언어 한국어 -->
<head>                                       <!-- [설정 영역] 화면엔 안 보임 -->
  <meta charset="UTF-8">                     <!-- 한글 깨짐 방지 -->
  <!-- 모바일 화면 폭에 맞춤 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음료 자판기</title>                   <!-- 브라우저 탭 제목 -->
  <style>                                    /* [이 페이지 전용 CSS] */
    body {
      padding: 24px;                         /* 화면 안쪽 여백 */
      font-family: system-ui, sans-serif;    /* 시스템 기본 글꼴 */
    }
    #balance {
      font-size: 24px;                       /* 넣은 돈 숫자를 크게 */
      font-weight: bold;                     /* 굵게 */
    }
  </style>
</head>
<body>                                       <!-- [화면 영역] 여기부터 보임 -->
  <h1>음료 자판기</h1>                         <!-- 큰 제목 -->
  <p>넣은 돈 <span id="balance"></span></p>   <!-- 넣은 돈 자리 (#balance) -->
  <p>                                        <!-- [동전 버튼 줄] -->
    <!-- 누르면 machine.insert(500) -->
    <button id="coin-500" type="button">500원 넣기</button>
    <!-- 누르면 machine.insert(1000) -->
    <button id="coin-1000" type="button">1000원 넣기</button>
  </p>
  <p>                                         <!-- [음료 버튼 줄] -->
    <!-- 누르면 makeBuyer("물", 800)이 만든 함수 실행 -->
    <button id="water" type="button">물 800원</button>
    <!-- 누르면 makeBuyer("주스", 1200)이 만든 함수 실행 -->
    <button id="juice" type="button">주스 1200원</button>
  </p>
  <p id="message"></p>                       <!-- 안내 문구 자리 (#message) -->
  <!-- 「10월 29일 판매 1200원」 자리 (#today, #total) -->
  <p><span id="today"></span> 판매 <span id="total"></span></p>

  <script src="vending.js"></script>         <!-- 요소가 다 생긴 뒤 JS 실행 -->
</body>
</html>
