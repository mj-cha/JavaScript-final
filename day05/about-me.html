<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>차코딩 소개</title>
  <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <nav class="nav">
        <span class="logo">차코딩</span>
        <ul class="menu">
          <li><a href="#intro">소개</a></li>
          <li><a href="#work">작업</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="intro" class="intro">
        <img src="https://picsum.photos/id/0/320/320" alt="책상 위의 노트북" class="profile">
        <div> 
          <h1>차코딩</h1>
          <p class="lead">웹 개발을 배우고 있습니다. </p>
         </div>
      </section>

    <article class="card">
      <span class="badge">NEW</span>
      <h2>개인 소개 페이지</h2>
      <p>HTML과 CSS로 만든 첫 페이지입니다.</p>
    </article>



      <section id="work">
        <h2>작업</h2>

        <div class="cards">
          <article class="card">
            <h3>개인 소개 페이지</h3>
            <p>HTML만으로 만든 첫 페이지입니다.</p>
          </article>

          <article class="card">
            <h3>회원가입 폼</h3>
            <p>입력 요소와 기본 검증을 연습했습니다.</p>
          </article>

          <article class="card">
            <h3>시맨틱 구조 정리</h3>
            <p>검색엔진과 화면낭독기를 고려했습니다.</p>
          </article>
        </div>
      </section>

      <section id="contact">
        <h2>연락처</h2>

        <form action="/contact" method="post">
          <fieldset>
            <legend>문의 남기기</legend>

            <label for="name">이름</label>
            <input type="text" id="name" name="name" required>

            <label for="message">내용</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">보내기</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>2026 차코딩</p>
    </footer>
  </body>
</html>
